<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода PWA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Прогноз погоды</h1>
            <nav>
                <a href="/about">О проекте</a>
            </nav>
        </header>

        <main>
            <div class="search-section">
                <input type="text"
                       id="cityInput"
                       placeholder="Введите город (moscow, london...)">
                <button id="getWeatherBtn">Найти</button>
            </div>

            <div id="weatherResult" class="result-section">
            </div>
        </main>

        <footer>
            <p>Доступные города: Moscow, London, NewYork, Tokyo, Dubai</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
